<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dots and Boxes - Modern Play</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Play the ultimate, premium Dots and Boxes game online. Challenge a friend or test your skills against our smart AI. Responsive design, beautiful animations, and synthesized audio!">
  <meta name="keywords" content="dots and boxes, online game, board game, local multiplayer, AI opponent, web game, responsive">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Gradients -->
  <div class="bg-blur bg-blur-1"></div>
  <div class="bg-blur bg-blur-2"></div>

  <div class="app-container">
    <!-- MENU SCREEN -->
    <section id="menu-screen" class="screen active">
      <div class="hero-header">
        <div class="logo-icon">
          <span class="dot-p dot-p1"></span>
          <span class="line-p"></span>
          <span class="dot-p dot-p2"></span>
        </div>
        <h1>Dots & Boxes</h1>
        <p class="subtitle">A premium grid-conquering strategy game</p>
      </div>

      <div class="menu-card">
        <!-- Game Mode Selection -->
        <div class="form-group">
          <label>Game Mode</label>
          <div class="segmented-control" id="mode-control">
            <button class="active" data-mode="ai" id="btn-mode-ai">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10v4a2 2 0 0 1-2 2h-1a2 2 0 0 0-2 2v1a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H4a2 2 0 0 1-2-2v-4A10 10 0 0 1 12 2z"/><rect x="9" y="11" width="6" height="4" rx="1"/></svg>
              <span>vs Computer</span>
            </button>
            <button data-mode="pvp" id="btn-mode-pvp">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Pass & Play</span>
            </button>
          </div>
        </div>

        <!-- AI Difficulty Selector -->
        <div class="form-group" id="difficulty-group">
          <label>AI Difficulty</label>
          <div class="segmented-control mini" id="difficulty-control">
            <button data-difficulty="easy" id="btn-diff-easy">Easy</button>
            <button class="active" data-difficulty="medium" id="btn-diff-medium">Medium</button>
            <button data-difficulty="hard" id="btn-diff-hard">Hard</button>
          </div>
        </div>

        <!-- Grid Size Selector -->
        <div class="form-group">
          <label>Grid Size</label>
          <div class="segmented-control grid-sizes" id="size-control">
            <button data-size="3" id="btn-size-small">
              <span class="size-title">Small</span>
              <span class="size-desc">3 × 3 Boxes</span>
            </button>
            <button class="active" data-size="5" id="btn-size-medium">
              <span class="size-title">Medium</span>
              <span class="size-desc">5 × 5 Boxes</span>
            </button>
            <button data-size="7" id="btn-size-large">
              <span class="size-title">Large</span>
              <span class="size-desc">7 × 7 Boxes</span>
            </button>
          </div>
        </div>

        <!-- Customizations -->
        <div class="form-group">
          <label>Players Customize</label>
          <div class="player-custom-row">
            <!-- Player 1 Customizer -->
            <div class="player-config p1-config">
              <div class="color-indicator p1-color-bg"></div>
              <input type="text" id="p1-name-input" value="Player 1" placeholder="P1 Name" maxlength="12">
              <div class="color-palette">
                <button type="button" class="color-dot active" data-color="#4f46e5" style="background: #4f46e5;"></button>
                <button type="button" class="color-dot" data-color="#06b6d4" style="background: #06b6d4;"></button>
                <button type="button" class="color-dot" data-color="#10b981" style="background: #10b981;"></button>
                <button type="button" class="color-dot" data-color="#eab308" style="background: #eab308;"></button>
              </div>
            </div>
            
            <!-- Player 2 Customizer -->
            <div class="player-config p2-config">
              <div class="color-indicator p2-color-bg"></div>
              <input type="text" id="p2-name-input" value="Computer" placeholder="P2 Name" maxlength="12">
              <div class="color-palette">
                <button type="button" class="color-dot active" data-color="#e11d48" style="background: #e11d48;"></button>
                <button type="button" class="color-dot" data-color="#ec4899" style="background: #ec4899;"></button>
                <button type="button" class="color-dot" data-color="#f97316" style="background: #f97316;"></button>
                <button type="button" class="color-dot" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Start Button -->
        <div class="menu-buttons-row">
          <button id="start-game-btn" class="primary-btn">
            Play Game
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
          <button id="view-leaderboard-btn" class="secondary-btn" title="View Matchups against Friends" aria-label="View Matchups against Friends">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/><path d="M12 2a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z"/></svg>
            <span>Leaderboard</span>
          </button>
        </div>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="game-screen" class="screen">
      <!-- Game Header Controls & Scoreboard -->
      <div class="game-header">
        <button id="back-to-menu-btn" class="icon-btn" title="Exit to Menu" aria-label="Exit to Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        
        <div class="scoreboard">
          <div class="player-score-card p1-card active" id="p1-card">
            <span class="player-avatar p1-avatar-initial">P1</span>
            <div class="player-meta">
              <span class="player-name" id="p1-name-display">Player 1</span>
              <span class="player-score" id="p1-score-display">0</span>
            </div>
          </div>

          <div class="versus-divider">vs</div>

          <div class="player-score-card p2-card" id="p2-card">
            <div class="player-meta">
              <span class="player-name" id="p2-name-display">Computer</span>
              <span class="player-score" id="p2-score-display">0</span>
            </div>
            <span class="player-avatar p2-avatar-initial">AI</span>
          </div>
        </div>

        <button id="mute-btn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <svg id="mute-icon-sound" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <svg id="mute-icon-silence" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
      </div>

      <!-- Action Panel & Board status -->
      <div class="status-panel">
        <p id="game-status-text">Your turn! Connect two dots.</p>
      </div>

      <!-- Interactive SVG Game Board -->
      <div class="board-outer-container">
        <div class="board-inner-wrapper">
          <svg id="game-board-svg" width="100%" height="100%"></svg>
        </div>
      </div>

      <!-- Bottom controls -->
      <div class="game-footer">
        <button id="reset-game-btn" class="secondary-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Restart Game
        </button>
      </div>
    </section>
  </div>

  <!-- LEADERBOARD OVERLAY MODAL -->
  <div id="leaderboard-modal" class="modal-overlay">
    <div class="modal-card leaderboard-card">
      <div class="modal-header">
        <h2>Friends Matchups</h2>
        <button id="leaderboard-close-btn" class="close-btn" aria-label="Close Leaderboard">&times;</button>
      </div>
      <p class="leaderboard-subtitle">Head-to-head records in Pass & Play mode</p>

      <div class="leaderboard-content-wrapper">
        <div id="leaderboard-list" class="leaderboard-list">
          <!-- Dynamically populated in JavaScript -->
        </div>
      </div>

      <div class="leaderboard-footer">
        <button id="leaderboard-reset-btn" class="reset-stats-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear Matchup History
        </button>
      </div>
    </div>
  </div>

  <!-- GAME OVER OVERLAY MODAL -->
  <div id="game-over-modal" class="modal-overlay">
    <canvas id="game-over-particles"></canvas>
    <div class="modal-card">
      <div class="trophy-container">
        <!-- SVG Animated Trophy -->
        <svg class="trophy-svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/>
          <path d="M12 2a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z"/>
        </svg>
      </div>
      
      <h2 id="winner-title">Player 1 Wins!</h2>
      <p class="winner-subtitle" id="winner-subtitle">What a spectacular game!</p>

      <div class="modal-score-summary">
        <div class="summary-card p1-summary">
          <span class="summary-name" id="summary-p1-name">Player 1</span>
          <span class="summary-score" id="summary-p1-score">15</span>
        </div>
        <div class="summary-divider">:</div>
        <div class="summary-card p2-summary">
          <span class="summary-score" id="summary-p2-score">10</span>
          <span class="summary-name" id="summary-p2-name">Computer</span>
        </div>
      </div>

      <div class="modal-buttons">
        <button id="modal-replay-btn" class="primary-btn">
          Play Again
        </button>
        <button id="modal-menu-btn" class="secondary-btn">
          Back to Menu
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="game.js"></script>
</body>
</html>
